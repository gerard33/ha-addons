name: Whatsapp
version: "1.9.0"
slug: whatsapp_addon
description: Whatsapp addon for send message from Home Assistant
url: "https://github.com/gerard33/ha-addons/tree/main/whatsapp_addon"
homeassistant_api: true
hassio_api: true
arch:
  - aarch64
  - amd64
init: false
map:
  - homeassistant_config:rw
options:
  clients:
    - default
  whatsapp_log_level: warn
schema:
  clients:
    - str
  whatsapp_log_level: list(trace|debug|info|warn|error|silent)?
